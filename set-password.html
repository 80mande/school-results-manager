
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Your Password | EduRecord</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f6fb;
      font-family: Arial, sans-serif;
      color: #1f2937;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 10px;
      color: #14532d;
      text-align: center;
      font-size: 26px;
    }

    .subtitle {
      margin-bottom: 25px;
      color: #64748b;
      text-align: center;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #15803d;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      display: none;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    .info {
      display: block !important;
      background: #dbeafe;
      color: #1e40af;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: #64748b;
    }

    .footer a {
      color: #15803d;
      text-decoration: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>EduRecord</h1>

    <p class="subtitle" id="subtitle">
      Please wait while we verify your secure link.
    </p>

    <form id="passwordForm" class="hidden">
      <label for="password">New password</label>
      <input
        type="password"
        id="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="At least 8 characters"
        required
      >

      <label for="confirmPassword">Confirm password</label>
      <input
        type="password"
        id="confirmPassword"
        minlength="8"
        autocomplete="new-password"
        placeholder="Enter your password again"
        required
      >

      <button type="submit" id="submitButton">
        Set My Password
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <div class="footer">
      EduRecord School Management System
      <br><br>
      <a href="https://edurecord.com.ng/">Return to EduRecord</a>
    </div>
  </main>

  <script>
    "use strict";

    const SUPABASE_URL =
      "https://dukqweogkftgvbrhzjkk.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_7yIKAC07tFFzijxPTtzShg_HB96TFQi";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,

          // We process invitation and recovery links ourselves
          // to avoid processing the same link twice.
          detectSessionInUrl: false
        }
      }
    );

    const form = document.getElementById("passwordForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");
    const subtitle = document.getElementById("subtitle");

    let sessionVerified = false;
    let recoveryMode = false;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    function showForm() {
      form.classList.remove("hidden");

      if (recoveryMode) {
        subtitle.textContent =
          "Choose a new password for your EduRecord account.";
        button.textContent = "Update My Password";
      } else {
        subtitle.textContent =
          "Welcome! Create a password to activate your school administrator account.";
        button.textContent = "Set My Password";
      }
    }

    function hideForm() {
      form.classList.add("hidden");
    }

    function cleanUrl() {
      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );
    }

    async function checkInvitationOrRecovery() {
      const params = new URLSearchParams(
        window.location.search
      );

      const hashParams = new URLSearchParams(
        window.location.hash.substring(1)
      );

      const urlError =
        params.get("error_description") ||
        hashParams.get("error_description");

      if (urlError) {
        throw new Error(
          "This link is invalid or has expired. Please return to EduRecord and request a new password-reset link, or ask the owner to resend your invitation."
        );
      }

      const code = params.get("code");

      const accessToken = hashParams.get("access_token");
      const refreshToken = hashParams.get("refresh_token");

      // Detect an explicitly marked recovery link.
      if (
        params.get("type") === "recovery" ||
        hashParams.get("type") === "recovery"
      ) {
        recoveryMode = true;
      }

      // Process Supabase PKCE invitation or recovery link.
      if (code) {
        const { error } =
          await supabaseClient.auth.exchangeCodeForSession(code);

        if (error) {
          throw new Error(
            "We could not verify this link. It may have expired or already been used. Please request a new link."
          );
        }

        cleanUrl();
      }

      // Also support Supabase links using access and refresh tokens.
      else if (accessToken && refreshToken) {
        const { error } =
          await supabaseClient.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });

        if (error) {
          throw new Error(
            "We could not verify this link. Please request a new link."
          );
        }

        cleanUrl();
      }

      // Confirm the authenticated session.
      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error) {
        throw error;
      }

      if (!data.session || !data.session.user) {
        throw new Error(
          "No valid account session was found. Please open the original invitation or password-reset link from your email."
        );
      }

      sessionVerified = true;
      showForm();

      if (recoveryMode) {
        showMessage(
          "Password-reset link verified. You can now create a new password.",
          "success"
        );
      } else {
        showMessage(
          "Invitation verified. You can now create your password.",
          "success"
        );
      }
    }

    // Supabase reports when a password-recovery link is used.
    supabaseClient.auth.onAuthStateChange(
      function(event, session) {
        if (
          event === "PASSWORD_RECOVERY" &&
          session &&
          session.user
        ) {
          recoveryMode = true;
          sessionVerified = true;
          showForm();

          showMessage(
            "Password-reset link verified. You can now create a new password.",
            "success"
          );
        }
      }
    );

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!sessionVerified) {
        showMessage(
          "Your secure link has not been verified. Please reopen the link from your email.",
          "error"
        );
        return;
      }

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        showMessage(
          "Your password must contain at least 8 characters.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage(
          "The passwords do not match. Please try again.",
          "error"
        );
        return;
      }

      button.disabled = true;
      button.textContent = "Saving password...";

      try {
        const { data, error } =
          await supabaseClient.auth.updateUser({
            password: password
          });

        if (error) {
          throw error;
        }

        if (!data.user) {
          throw new Error(
            "We could not confirm your account. Please try again."
          );
        }

        hideForm();

        if (recoveryMode) {
          showMessage(
            "Your password has been reset successfully! You can now sign in to EduRecord using your new password.",
            "success"
          );
        } else {
          showMessage(
            "Your password has been set successfully! You can now sign in to EduRecord using your account credentials.",
            "success"
          );
        }

        subtitle.textContent =
          "Your EduRecord account is ready.";

      } catch (error) {
        console.error("Password update failed:", error);

        showMessage(
          error.message ||
          "Something went wrong. Please try again.",
          "error"
        );

        button.disabled = false;
        button.textContent = recoveryMode
          ? "Update My Password"
          : "Set My Password";
      }
    });

    checkInvitationOrRecovery().catch(function(error) {
      console.error("Link verification failed:", error);

      sessionVerified = false;
      hideForm();

      showMessage(
        error.message ||
        "We could not verify your secure link. Please request a new one.",
        "error"
      );

      subtitle.textContent =
        "Your secure link could not be verified.";
    });
  </script>
</body>
</html>
