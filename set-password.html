<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Your Password | EduRecord</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f6fb;
      font-family: Arial, sans-serif;
      color: #1f2937;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px 24px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 10px;
      color: #14532d;
      text-align: center;
      font-size: 26px;
    }

    .subtitle {
      margin-bottom: 25px;
      color: #64748b;
      text-align: center;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #15803d;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      display: none;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    .info {
      display: block !important;
      background: #dbeafe;
      color: #1e40af;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: #64748b;
    }

    .footer a {
      color: #15803d;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>EduRecord</h1>

    <p class="subtitle">
      Welcome! Create a password to activate your school administrator account.
    </p>

    <form id="passwordForm">
      <label for="password">New password</label>
      <input
        type="password"
        id="password"
        minlength="8"
        autocomplete="new-password"
        placeholder="At least 8 characters"
        required
      >

      <label for="confirmPassword">Confirm password</label>
      <input
        type="password"
        id="confirmPassword"
        minlength="8"
        autocomplete="new-password"
        placeholder="Enter your password again"
        required
      >

      <button type="submit" id="submitButton">
        Set My Password
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <div class="footer">
      EduRecord School Management System
      <br><br>
      <a href="./">Return to EduRecord</a>
    </div>
  </main>

  <script>
    const SUPABASE_URL =
      "https://dukqweogkftgvbrhzjkk.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_7yIKAC07tFFzijxPTtzShg_HB96TFQi";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const form = document.getElementById("passwordForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    async function checkInvitation() {
      const params = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(
        window.location.hash.substring(1)
      );

      const urlError =
        params.get("error_description") ||
        hashParams.get("error_description");

      if (urlError) {
        showMessage(
          "The invitation link may have expired or is invalid. Please ask the EduRecord owner to send a new invitation.",
          "error"
        );
        form.style.display = "none";
        return;
      }

      const code = params.get("code");

      if (code) {
        const { error } =
          await supabaseClient.auth.exchangeCodeForSession(code);

        if (error) {
          showMessage(
            "We could not verify this invitation. The link may have expired. Please request a new invitation.",
            "error"
          );
          form.style.display = "none";
          return;
        }

        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );
      }

      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error || !data.session) {
        showMessage(
          "Open this page using the invitation link sent to your email. If the link has expired, ask the EduRecord owner to send another invitation.",
          "info"
        );
        form.style.display = "none";
        return;
      }

      showMessage(
        "Invitation verified. You can now create your password.",
        "success"
      );
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        showMessage(
          "Your password must contain at least 8 characters.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage(
          "The passwords do not match. Please try again.",
          "error"
        );
        return;
      }

      button.disabled = true;
      button.textContent = "Saving password...";

      try {
        const { data, error } =
          await supabaseClient.auth.updateUser({
            password: password
          });

        if (error) {
          throw error;
        }

        if (!data.user) {
          throw new Error(
            "We could not confirm your account. Please try again."
          );
        }

        showMessage(
          "Your password has been set successfully! You can now sign in to EduRecord using your account credentials.",
          "success"
        );

        form.style.display = "none";

      } catch (error) {
        showMessage(
          error.message ||
          "Something went wrong. Please try again.",
          "error"
        );

        button.disabled = false;
        button.textContent = "Set My Password";
      }
    });

    checkInvitation().catch(function() {
      showMessage(
        "We could not verify your invitation. Please open the original invitation link again or request a new one.",
        "error"
      );

      form.style.display = "none";
    });
  </script>
</body>
  </html>
