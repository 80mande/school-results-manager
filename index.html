<script>
"use strict";

const SUPABASE_URL = "https://dukqweogkftgvbrhzjkk.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_7yIKAC07tFFzijxPTtzShg_HB96TFQi";

let supabaseClient = null;
let currentSchools = [];
let currentUser = null;
let loadingSchools = false;

const $ = (id) => document.getElementById(id);

function setNotice(element, message, type = "info") {
  element.textContent = message;
  element.className = "notice notice-" + type;
  element.classList.remove("hidden");
}

function hideNotice(element) {
  element.classList.add("hidden");
}

function showPage(pageId) {
  ["homePage", "loginPage", "dashboardPage", "deniedPage"]
    .forEach(id => {
      $(id).classList.toggle("hidden", id !== pageId);
    });
}

function showHome() {
  showPage("homePage");
}

function showLogin() {
  $("loginForm").reset();
  hideNotice($("loginMessage"));
  showPage("loginPage");
}

function showComingSoon() {
  alert("This portal will be available in a future update.");
}

function normalizeSchoolCode(value) {
  return value.trim().toUpperCase();
}

function normalizeSubdomain(value) {
  return value.trim().toLowerCase();
}

function updateSubdomainPreview() {
  const slug = normalizeSubdomain($("schoolSubdomain").value);
  const preview = $("subdomainPreview");

  preview.textContent = slug
    ? "Proposed school address: " + slug +
      ".yourdomain.com (preview only; domain configuration is separate)."
    : "Enter a subdomain name to see its preview.";
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[character]);
}

function showUser(profile, user) {
  $("topbarActions").classList.remove("hidden");
  $("userLabel").textContent =
    profile.full_name || user.email || "EduRecord Owner";
}

function clearUser() {
  $("topbarActions").classList.add("hidden");
  $("userLabel").textContent = "";
}

async function initializeEduRecord() {
  const message = $("connectionMessage");

  try {
    if (!window.supabase ||
        typeof window.supabase.createClient !== "function") {
      throw new Error(
        "Supabase did not load. Check your internet connection and refresh."
      );
    }

    supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const { data, error } =
      await supabaseClient.auth.getSession();

    if (error) throw error;

    if (data.session && data.session.user) {
      await verifyCurrentUser(data.session.user);
    } else {
      showHome();
      setNotice(
        message,
        "EduRecord connected. Please sign in to continue.",
        "success"
      );
    }

    supabaseClient.auth.onAuthStateChange((event) => {
      if (event === "SIGNED_OUT") {
        currentUser = null;
        clearUser();
        showHome();
      }
    });

  } catch (error) {
    console.error("EduRecord connection error:", error);

    setNotice(
      message,
      "Connection error: " +
        (error.message || "Please refresh and try again."),
      "error"
    );
  }
}

async function verifyCurrentUser(user) {
  currentUser = user;

  try {
    const { data: profile, error } = await supabaseClient
      .from("profiles")
      .select("role, full_name, is_active")
      .eq("id", user.id)
      .single();

    if (error) throw error;

    if (!profile ||
        profile.role !== "owner" ||
        profile.is_active === false) {
      clearUser();
      setNotice(
        $("connectionMessage"),
        "This account is not authorised to access the owner dashboard.",
        "error"
      );
      showPage("deniedPage");
      return;
    }

    showUser(profile, user);
    showPage("dashboardPage");

    setNotice(
      $("connectionMessage"),
      "Administrator verified. EduRecord is connected.",
      "success"
    );

    await loadSchools();

  } catch (error) {
    console.error("Profile verification error:", error);

    currentUser = null;
    clearUser();
    showPage("loginPage");

    setNotice(
      $("loginMessage"),
      "Unable to verify your account. Check your owner profile and try again.",
      "error"
    );
  }
}

$("loginForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  if (!supabaseClient) {
    setNotice(
      $("loginMessage"),
      "EduRecord is still connecting. Please wait and try again.",
      "error"
    );
    return;
  }

  const button = $("loginButton");
  button.disabled = true;
  button.textContent = "Signing in...";
  hideNotice($("loginMessage"));

  try {
    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: $("loginEmail").value.trim(),
        password: $("loginPassword").value
      });

    if (error) throw error;

    await verifyCurrentUser(data.user);

  } catch (error) {
    console.error("Login error:", error);

    setNotice(
      $("loginMessage"),
      error.message || "Login failed. Please try again.",
      "error"
    );

  } finally {
    button.disabled = false;
    button.textContent = "Login";
  }
});

async function logout() {
  if (!supabaseClient) return;

  try {
    const { error } = await supabaseClient.auth.signOut();

    if (error) throw error;

    currentUser = null;
    clearUser();
    $("loginForm").reset();
    $("schoolForm").reset();
    showHome();

  } catch (error) {
    alert("Could not sign out: " + error.message);
  }
}

async function loadSchools() {
  if (!currentUser || loadingSchools) return;

  loadingSchools = true;

  setNotice(
    $("schoolListMessage"),
    "Loading registered schools...",
    "info"
  );

  try {
    const { data, error } = await supabaseClient
      .from("schools")
      .select(
        "id, school_name, school_code, subdomain, is_active, created_at"
      )
      .order("created_at", { ascending: false });

    if (error) throw error;

    currentSchools = data || [];

    $("totalSchools").textContent = currentSchools.length;
    $("activeSchools").textContent =
      currentSchools.filter(school => school.is_active).length;
    $("inactiveSchools").textContent =
      currentSchools.filter(school => !school.is_active).length;

    renderSchools();

    $("schoolListMessage").classList.add("hidden");
    $("dashboardMessage").classList.add("hidden");

  } catch (error) {
    console.error("Loading schools error:", error);

    setNotice(
      $("schoolListMessage"),
      "Could not load schools: " + error.message,
      "error"
    );

  } finally {
    loadingSchools = false;
  }
}

function renderSchools() {
  const query = $("schoolSearch").value.trim().toLowerCase();

  const schools = currentSchools.filter(school =>
    [
      school.school_name,
      school.school_code,
      school.subdomain
    ].some(value =>
      String(value || "").toLowerCase().includes(query)
    )
  );

  if (!schools.length) {
    $("schoolsTableBody").innerHTML =
      '<tr><td colspan="6" class="muted">' +
      (currentSchools.length
        ? "No matching schools found."
        : "No schools registered yet.") +
      "</td></tr>";
    return;
  }

  $("schoolsTableBody").innerHTML = schools.map(school => {
    const status = school.is_active
      ? '<span class="status active">Active</span>'
      : '<span class="status inactive">Inactive</span>';

    const action = school.is_active ? "Deactivate" : "Activate";
    const actionClass = school.is_active ? "btn-danger" : "";

    const date = school.created_at
      ? new Date(school.created_at).toLocaleDateString()
      : "—";

    return `
      <tr>
        <td>${escapeHtml(school.school_name)}</td>
        <td>${escapeHtml(school.school_code)}</td>
        <td>${escapeHtml(school.subdomain)}</td>
        <td>${status}</td>
        <td>${escapeHtml(date)}</td>
        <td>
          <button
            class="btn btn-small ${actionClass}"
            type="button"
            data-id="${escapeHtml(school.id)}"
            data-active="${school.is_active}">
            ${action}
          </button>
        </td>
      </tr>
    `;
  }).join("");

  $("schoolsTableBody")
    .querySelectorAll("button[data-id]")
    .forEach(button => {
      button.addEventListener("click", () => {
        changeSchoolStatus(
          button.dataset.id,
          button.dataset.active !== "true"
        );
      });
    });
}

$("schoolForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  if (!supabaseClient || !currentUser) {
    setNotice(
      $("dashboardMessage"),
      "Please sign in again before registering a school.",
      "error"
    );
    return;
  }

  const button = $("registerButton");
  button.disabled = true;
  button.textContent = "Registering...";

  try {
    const schoolName = $("schoolName").value.trim();
    const schoolCode =
      normalizeSchoolCode($("schoolCode").value);
    const subdomain =
      normalizeSubdomain($("schoolSubdomain").value);

    if (!schoolName || !schoolCode || !subdomain) {
      throw new Error("Please complete all school fields.");
    }

    const { error } = await supabaseClient
      .from("schools")
      .insert([{
        school_name: schoolName,
        school_code: schoolCode,
        subdomain: subdomain,
        is_active: true
      }]);

    if (error) throw error;

    $("schoolForm").reset();
    updateSubdomainPreview();

    setNotice(
      $("dashboardMessage"),
      "School registered successfully.",
      "success"
    );

    await loadSchools();

  } catch (error) {
    console.error("School registration error:", error);

    const message = error.code === "23505"
      ? "That school code or subdomain is already in use."
      : error.message || "Could not register this school.";

    setNotice($("dashboardMessage"), message, "error");

  } finally {
    button.disabled = false;
    button.textContent = "Register School";
  }
});

async function changeSchoolStatus(schoolId, active) {
  const action = active ? "activate" : "deactivate";

  if (!confirm("Are you sure you want to " + action + " this school?")) {
    return;
  }

  try {
    const { error } = await supabaseClient
      .from("schools")
      .update({ is_active: active })
      .eq("id", schoolId);

    if (error) throw error;

    setNotice(
      $("dashboardMessage"),
      "School " + (active ? "activated" : "deactivated") + " successfully.",
      "success"
    );

    await loadSchools();

  } catch (error) {
    console.error("School status update error:", error);

    setNotice(
      $("dashboardMessage"),
      "Could not update school status: " + error.message,
      "error"
    );
  }
}

$("schoolSearch").addEventListener("input", renderSchools);
$("schoolSubdomain").addEventListener("input", updateSubdomainPreview);

$("currentYear").textContent = new Date().getFullYear();

initializeEduRecord();
</script>
</body>
  </html>
